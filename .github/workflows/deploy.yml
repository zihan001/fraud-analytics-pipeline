name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'lambda/**'
      - '.github/workflows/deploy.yml'

permissions:
  id-token: write
  contents: read

jobs:
  deploy-lambda:
    name: Deploy Lambda Function
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      
      - name: Package Lambda function
        run: |
          cd lambda
          rm -rf package lambda.zip
          uv pip install -r requirements.txt --target package/ --python-preference only-system --system
          cd package && zip -r ../lambda.zip . -q && cd ..
          zip -g lambda.zip handler.py -q
          ls -lh lambda.zip
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::735702560596:role/fraud-analytics-github-actions-role
          aws-region: us-east-1
      
      - name: Deploy to Lambda
        run: |
          aws lambda update-function-code \
            --function-name fraud-analytics-dev-fraud-scorer \
            --zip-file fileb://lambda/lambda.zip
      
      - name: Wait for Lambda update to complete
        run: |
          aws lambda wait function-updated \
            --function-name fraud-analytics-dev-fraud-scorer
      
      - name: Verify deployment
        run: |
          # Show basic function information (existing behavior)
          aws lambda get-function \
            --function-name fraud-analytics-dev-fraud-scorer \
            --query 'Configuration.[FunctionName,LastModified,State]' \
            --output table

          # Verify that the deployed code matches the local package by comparing CodeSha256
          echo "Computing local deployment package SHA-256..."
          LOCAL_SHA=$(openssl dgst -sha256 -binary lambda/lambda.zip | openssl base64)
          echo "Local CodeSha256: $LOCAL_SHA"

          echo "Fetching deployed Lambda CodeSha256..."
          REMOTE_SHA=$(aws lambda get-function \
            --function-name fraud-analytics-dev-fraud-scorer \
            --query 'Configuration.CodeSha256' \
            --output text)
          echo "Remote CodeSha256: $REMOTE_SHA"

          if [ "$LOCAL_SHA" != "$REMOTE_SHA" ]; then
            echo "ERROR: Deployed Lambda code SHA does not match local package SHA."
            exit 1
          fi

          echo "Deployment verification successful: Lambda code SHA matches local package."
