name: Deploy Infrastructure

on:
  push:
    branches: [main]
    paths:
      - 'infra/envs/dev/**'
      - '.github/workflows/deploy-infra.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
      auto_approve:
        description: 'Auto-approve Terraform apply'
        required: true
        default: false
        type: boolean

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  AWS_REGION: ca-west-1
  AWS_ROLE_ARN: arn:aws:iam::735702560596:role/fraud-analytics-github-actions-role
  TF_VERSION: '1.6.0'

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Terraform Format Check
        run: terraform -chdir=infra/envs/dev fmt -check -recursive
        continue-on-error: true
      
      - name: Terraform Init
        run: terraform -chdir=infra/envs/dev init
      
      - name: Terraform Validate
        run: terraform -chdir=infra/envs/dev validate
      
      - name: Terraform Plan
        id: plan
        run: |
          terraform -chdir=infra/envs/dev plan -out=tfplan -no-color | tee plan_output.txt
          echo "PLAN_EXIT_CODE=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
      
      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: infra/envs/dev/tfplan
          retention-days: 7
      
      - name: Comment PR with plan
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('plan_output.txt', 'utf8');
            const output = `#### Terraform Plan 📖
            \`\`\`
            ${plan}
            \`\`\`
            
            *Pushed by: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: terraform-plan
    if: |
      github.ref == 'refs/heads/main' && 
      (github.event_name == 'push' || 
       (github.event_name == 'workflow_dispatch' && inputs.auto_approve == true))
    environment:
      name: dev
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Terraform Init
        run: terraform -chdir=infra/envs/dev init
      
      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: infra/envs/dev/
      
      - name: Terraform Apply
        run: terraform -chdir=infra/envs/dev apply -auto-approve tfplan
      
      - name: Get outputs
        id: outputs
        run: |
          cd infra/envs/dev
          echo "kinesis_stream=$(terraform output -raw kinesis_stream_name)" >> $GITHUB_OUTPUT
          echo "lambda_function=$(terraform output -raw lambda_function_name)" >> $GITHUB_OUTPUT
      
      - name: Summary
        run: |
          echo "### Infrastructure Deployment Summary 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment**: dev" >> $GITHUB_STEP_SUMMARY
          echo "**Region**: ${{ env.AWS_REGION }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Deployed Resources**:" >> $GITHUB_STEP_SUMMARY
          echo "- Kinesis Stream: \`${{ steps.outputs.outputs.kinesis_stream }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Lambda Function: \`${{ steps.outputs.outputs.lambda_function }}\`" >> $GITHUB_STEP_SUMMARY
