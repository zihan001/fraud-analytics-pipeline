[build-system]
requires = ["setuptools>=45", "setuptools-scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-analytics-pipeline"
version = "0.1.0"
description = "Real-time + batch hybrid fraud analytics pipeline on AWS"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "boto3>=1.26.0",
    "python-dotenv>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["producer*", "lambda*"]

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]
