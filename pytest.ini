[pytest]
# Pytest configuration for fraud analytics pipeline

# Python path for module imports
pythonpath = .

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests producer/tests lambda

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Markers for test categorization
markers =
    unit: Unit tests for individual components
    integration: Integration tests requiring AWS services
    slow: Tests that take longer to execute
    lambda: Lambda function tests
    producer: Producer component tests

# Coverage options (when running pytest --cov)
# Note: Actual coverage configuration is in .coveragerc
